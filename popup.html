<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileSentinel Notification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      overflow: hidden;
    }

    .popup-card {
      width: 100%;
      height: 100%;
      background: rgba(13, 17, 23, 0.95);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: popin 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .popup-card:hover {
      border-color: rgba(56, 189, 248, 0.5);
      transform: translateY(-2px);
    }

    .popup-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
    }

    .popup-card.action-CREATE::before { background: #10b981; }
    .popup-card.action-MODIFY::before { background: #f59e0b; }
    .popup-card.action-DELETE::before { background: #ef4444; }
    .popup-card.alert-suspicious::before { background: #ff4757; }

    @keyframes popin {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-action {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-CREATE { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .badge-MODIFY { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
    .badge-DELETE { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .badge-ALERT { background: rgba(239, 68, 68, 0.25); color: #ff6b6b; border: 1px solid #ef4444; }

    .proc-badge {
      font-size: 10px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 1px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-close-pop {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 11px;
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .btn-close-pop:hover {
      color: #f0f6fc;
      background: rgba(255, 255, 255, 0.1);
    }

    .narrative-banner {
      font-size: 11px;
      line-height: 1.3;
      color: #f0f6fc;
      margin: 4px 0;
      font-weight: 500;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .narrative-banner .hl-proc {
      color: #38bdf8;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .narrative-banner .hl-file {
      color: #ffffff;
      font-weight: 700;
    }

    .narrative-banner .hl-dir {
      color: #10b981;
      font-weight: 600;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 9px;
      color: #6e7681;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 3px;
    }

    .click-hint {
      color: #38bdf8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="popup-card" id="popup-card">
    <div class="card-header">
      <div class="badge-group">
        <span class="badge-action" id="action-badge">MODIFICADO</span>
        <span class="proc-badge" id="proc-badge">⚡ Processo</span>
      </div>
      <button class="btn-close-pop" id="btn-close-pop" title="Fechar">✕</button>
    </div>

    <div class="narrative-banner" id="narrative-banner">
      <!-- Frase descritiva injetada dinamicamente -->
    </div>

    <div class="card-footer">
      <span class="click-hint">Clique para abrir o FileSentinel</span>
      <span id="pop-time">21:40:00</span>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('render-notification', (event, data) => {
      const card = document.getElementById('popup-card');
      const actionBadge = document.getElementById('action-badge');
      const procBadge = document.getElementById('proc-badge');
      const narrativeBanner = document.getElementById('narrative-banner');
      const popTime = document.getElementById('pop-time');

      const isSuspicious = data.alertLevel === 'suspicious' || data.alertLevel === 'warning';
      card.className = `popup-card action-${data.action} ${isSuspicious ? 'alert-suspicious' : ''}`;

      const actionText = data.isDirectory ?
        (data.action === 'CREATE' ? 'PASTA CRIADA' : data.action === 'DELETE' ? 'PASTA EXCLUÍDA' : 'PASTA MODIFICADA') :
        (data.action === 'CREATE' ? 'CRIADO' : data.action === 'MODIFY' ? 'MODIFICADO' : 'EXCLUÍDO');

      actionBadge.className = `badge-action ${isSuspicious ? 'badge-ALERT' : 'badge-' + data.action}`;
      actionBadge.textContent = isSuspicious && data.action === 'DELETE' ? 'EXCLUSÃO CRÍTICA' : actionText;

      const procName = data.process?.friendlyName || data.process?.Name || 'Processo Ativo';
      const isUser = data.process?.isUserAction;
      procBadge.textContent = isUser ? `👤 ${procName}` : `⚡ ${procName}`;

      narrativeBanner.innerHTML = data.narrative ? data.narrative.replace(/"/g, '<strong>"').replace(/"/g, '"</strong>') : `${procName} modificou ${data.fileName}`;

      popTime.textContent = data.timestamp || new Date().toLocaleTimeString('pt-BR');
    });

    document.getElementById('popup-card').addEventListener('click', (e) => {
      if (e.target.id === 'btn-close-pop') {
        e.stopPropagation();
        ipcRenderer.send('dismiss-popup');
        return;
      }
      ipcRenderer.send('popup-clicked');
    });

    document.getElementById('btn-close-pop').addEventListener('click', (e) => {
      e.stopPropagation();
      ipcRenderer.send('dismiss-popup');
    });
  </script>
</body>
</html>
